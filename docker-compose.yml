# OrbStack:  HOST_PORT=7815 docker compose up --build -d   ->  http://127.0.0.1:7815/api/health   (one port: 7815, from the packed range)
# The server binds 0.0.0.0 INSIDE the container (MFAADM_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below: Live can act on a PingOne tenant's admin plane (a test pins it).
# Mock is the default and needs nothing. Live stays refused unless you start it with MFA_ADMIN_MCP_MODE=live in your shell.
# Interactive sign-in (Live only): register the redirect URI http://localhost:<HOST_PORT>/api/oauth/callback on your OAuth application
# (the port you PUBLISH). The app compares the redirect URI's port with the Host header's port.
name: mfa-admin-mcp-lab

services:
  mfa-admin-mcp-lab:
    build: .
    restart: unless-stopped   # rule 21: comes back when OrbStack restarts
    ports:
      - "127.0.0.1:${HOST_PORT:-7815}:7815"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      PORT: "7815"
      MFAADM_BIND: 0.0.0.0
      MFAADM_CONTAINER: "1"
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-mfa-admin-mcp.local.ping-devops.com}
      MFAADM_DATA_DIR: /data
      MFA_ADMIN_MCP_MODE: ${MFA_ADMIN_MCP_MODE:-mock}
    volumes:
      - p1mcp-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Liveness plus "not broken": needs-setup (no connection yet) is healthy.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7815/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state!=='broken'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

volumes:
  p1mcp-data:
